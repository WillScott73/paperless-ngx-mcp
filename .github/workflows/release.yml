name: Release Paperless MCP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            binary_name: paperless-ngx-mcp
          - os: windows-latest
            goos: windows
            binary_name: paperless-ngx-mcp.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 \
          GOOS=${{ matrix.goos }} \
          GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary_name }}" ./cmd/paperless-ngx-mcp

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
